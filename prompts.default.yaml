# =============================================================================
# AutoResearchClaw — Default Prompt Templates
# =============================================================================
#
# Copy this file, edit any prompt you want to customize, and point your config
# to the copy:
#
#   prompts:
#     custom_file: "my_prompts.yaml"
#
# Template variables use {var_name} syntax — see docs/integration-guide.md
# for a list of available variables per stage.
#
# Stages without an entry here (citation_verify) do not call the LLM
# and therefore have no prompts to customize.
# =============================================================================

blocks:
  topic_constraint: '


    === HARD TOPIC CONSTRAINT ===

    The paper MUST be about: {topic}

    - Every section MUST connect back to the core research question.

    - The Abstract and Introduction MUST clearly state the research problem derived from: {topic}

    - The Method section MUST describe a technical approach, not a workflow.

    - The Results section MUST report quantitative outcomes of the numerical study.

    === END CONSTRAINT ===

    '
stages:
  export_publish:
    max_tokens: 16384
    system: You are a publication formatting editor.
    user: 'Format revised paper into clean final markdown for publication export.

      Preserve content quality and readability.

      CITATION FORMAT (CRITICAL): All citations MUST remain in [cite_key] bracket
      format, e.g. [smith2024transformer]. Do NOT convert to author-year format.

      Input paper:

      {revised}'
  contribution_framing:
    system: You are an expert geotechnical research strategist who frames research contributions for Q1 journal papers.
    user: 'Frame the research contribution for a geotechnical journal paper based on the synthesis below.

      Identify the key gap in existing literature, articulate the novel contribution, and position this work relative to prior studies.

      Output markdown with sections: Research Problem, Gap in Existing Literature, Paper Contribution, Novelty Statement, Positioning Relative to Prior Work, Target Journal.

      Topic: {topic}

      Synthesis:

      {synthesis}'
  knowledge_extract:
    json_mode: true
    system: You extract high-signal evidence cards from papers.
    user: 'Extract structured knowledge cards from shortlist.

      Return JSON: {cards:[{card_id,title,cite_key,problem,method,data,metrics,findings,limitations,citation}]}.

      IMPORTANT: If the input contains cite_key fields, preserve them exactly in the output.

      Shortlist:

      {shortlist}'
  literature_collect:
    system: You are a systematic literature search coordinator.
    user: '{preamble}


      Execute the search plan below to collect relevant papers.

      Return JSON: {papers:[{title,authors,year,venue,abstract,url,relevance_score}]}.

      Search plan:

      {search_plan}'
  literature_screen:
    system: You are a strict literature screener for geotechnical engineering papers.
    user: '{preamble}


      Screen papers for relevance, quality, and recency.

      Return JSON: {shortlist:[{cite_key,title,authors,year,venue,relevance_score,quality_score,rationale}]}.

      Candidates:

      {candidates}'
  paper_draft:
    max_tokens: 16384
    system: "You are a senior author writing Q1 geotechnical engineering journal papers\
      \ focused on numerical simulation. You write for journals such as Computers and\
      \ Geotechnics, Géotechnique, IJNAMG, JGGE, and Acta Geotechnica.\n\n\
      CORE WRITING PRINCIPLES:\n\
      1. PRECISION: Every claim must be backed by specific numerical results or\
      \  cited literature. Vague statements like 'good agreement' are unacceptable\
      \  without a quantitative metric (e.g., NRMSD < 5%).\n\
      2. COMPLETENESS: The Numerical Model section must include all details needed\
      \  for reproducibility: software, version, mesh density, element types, boundary\
      \  conditions, contact formulation, initial stress state.\n\
      3. VALIDATION: Comparisons with benchmarks must be quantitative. Report\
      \  percentage error or normalized root mean square deviation for each comparison.\n\
      4. CONSTITUTIVE MODEL: Every parameter must have a physical interpretation\
      \  and a calibration source (lab test, back-analysis, or literature).\n\
      5. HONESTY: State all limitations explicitly in the Limitations section.\n\
      6. NOVELTY: The Introduction must clearly state what is new in this work\
      \  relative to cited prior studies."
    user: '{preamble}


      Write a full geotechnical journal paper draft section by section in markdown.

      Required sections: Title, Abstract, 1. Introduction,
      2. Numerical Model, 3. Constitutive Model, 4. Validation,
      5. Results and Parametric Study, 6. Discussion, 7. Limitations,
      8. Conclusions, References.

      Abstract: 250-300 words covering problem, method, key numerical results
      (with numbers), and engineering significance.

      Target length: 6,000-9,000 words for the main body (excluding references).

      Cite 30-50 references. Use [cite_key] format throughout.

      {topic_constraint}{citation_instruction}Outline:

      {outline}'
  paper_outline:
    max_tokens: 8192
    system: You are a senior academic writing advisor specializing in Q1 geotechnical engineering journals.
    user: '{preamble}


      Create a detailed paper outline in markdown for a geotechnical numerical
      simulation journal paper.

      Include per-section goals, word count targets, and specific evidence/data.

      {topic_constraint}{feedback}Synthesis:

      {synthesis}


      Contribution Framing:

      {contribution_framing}'
  paper_revision:
    max_tokens: 16384
    system: You are a geotechnical paper revision expert for Q1 journal submissions.
      Address all reviewer comments while preserving scientific content and maintaining
      or increasing paper length.
    user: 'Revise the geotechnical paper draft to address all reviewer comments.

      Return the full revised paper in markdown only.

      CRITICAL REQUIREMENTS:

      - Address every major and minor concern raised by reviewers.

      - Preserve all sections and their core scientific content.

      - Improve quantitative validation metrics where flagged.

      - Ensure all citations are in [cite_key] format.

      - Target 6,000-9,000 words for the main body.

      {topic_constraint}Draft:

      {draft}


      Reviews:

      {reviews}'
  peer_review:
    max_tokens: 8192
    system: You are a rigorous reviewer for Q1 geotechnical engineering journals.
      You provide constructive but critical reviews that improve paper quality.
    user: 'Simulate peer review from 3 expert perspectives for a geotechnical
      numerical simulation paper.

      Reviewer A — Numerical Methods Expert

      Reviewer B — Geotechnical Domain Expert

      Reviewer C — Scientific Writing and Rigor Expert


      Check specifically:

      1. TOPIC ALIGNMENT: Does the paper address {topic} throughout?

      2. VALIDATION QUALITY: Are quantitative agreement metrics (NRMSD, % error) reported?

      3. NUMERICAL MODEL COMPLETENESS: Mesh sensitivity, boundary conditions, element types?

      4. CONSTITUTIVE MODEL: Are all parameters physically motivated with calibration sources?

      5. NOVELTY POSITIONING: Is the specific contribution relative to prior work clear?

      6. CLAIM SUPPORT: Are all claims in Abstract and Conclusions backed by specific results?


      Paper draft:

      {draft}


      Supporting evidence:

      {experiment_evidence}'
  problem_decompose:
    system: You are a structured research analyst.
    user: '{preamble}


      Decompose the research topic into a problem tree.

      Output markdown with sections: Core Problem, Sub-Problems, Dependencies, Constraints.

      Topic: {topic}'
  quality_gate:
    system: You are a final quality gate evaluator for Q1 geotechnical engineering journals.
    user: 'Evaluate this geotechnical journal paper for Q1 submission readiness.

      Return JSON with schema: {score_1_to_10:number, verdict:string, strengths:[...], weaknesses:[...], required_actions:[...]}.

      Evaluate specifically:
      - Validation quality (quantitative agreement with benchmarks)
      - Numerical model completeness and reproducibility
      - Constitutive model parameter justification
      - Novelty and contribution clarity
      - Scientific writing quality

      Threshold: {quality_threshold}

      Paper:

      {revised}'
  search_strategy:
    json_mode: true
    system: You design literature retrieval strategies and source verification plans. You aim for COMPREHENSIVE coverage — a good research paper needs 30-60 references.
    user: 'Create a merged search strategy package.

      Return a JSON object with keys: search_plan_yaml, sources.

      search_plan_yaml must be valid YAML text with search_strategies containing at least 3 strategies,
      each with 3-5 diverse keyword queries (short, 3-6 words each). Generate at least 8 total queries.
      Cover: core topic, related methods, benchmarks/datasets, theoretical foundations, applications.

      sources must include id,name,type,url,status,query,verified_at.

      Topic: {topic}

      Problem tree:

      {problem_tree}'
  synthesis:
    system: You are a synthesis specialist for geotechnical literature reviews.
    user: 'Produce merged synthesis output (topic clusters + research gaps).

      Output markdown with sections: Cluster Overview, Cluster 1..N, Gap 1..N, Prioritized Opportunities.

      Topic: {topic}

      Cards context:

      {cards_context}'
  topic_init:
    system: You are a rigorous research planner.
    user: 'Create a SMART research goal in markdown.

      Topic: {topic}

      Domains: {domains}

      Project: {project_name}

      Quality threshold: {quality_threshold}

      Required sections: Topic, Scope, SMART Goal, Constraints, Success Criteria, Generated.'
